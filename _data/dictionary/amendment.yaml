word: amendment
type: noun
definition_list:
  - text: a change to a previous [disclosure](/disclosure/) report submitted via a subsequent [filing](/filing/)
    in_use:
      - text: "A committee may have to file an amendment, for example, to report a new treasurer, a new assistant treasurer, a new email address, a new joint fundraising committee authorized by the candidate, a change of address or a new campaign depository."
        source: FEC
        url: https://www.fec.gov/help-candidates-and-committees/filing-amendments/
        -text: "His amendment would focus on students who walked out of classes without written parental consent to be absent or to leave a school building. It would impose fines on school districts whenever administrators failed to “enforce school attendance laws and policies” tied to disciplining absent students. It also would sanction districts whenever it was proven school staff encouraged a walkout."
        source: Kansas Reflector
        url: https://kansasreflector.com/2026/03/03/kansas-senate-votes-to-subvert-students-first-amendment-right-to-join-public-protests/